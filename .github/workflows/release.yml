name: Release

# Đẩy tag dạng v1.2.3 để build bộ cài Windows và đăng lên GitHub Releases.
# Các máy đã cài sẽ tự thấy bản mới qua latest.json do bước này tạo ra.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Ghi chú hiện trong hộp thoại cập nhật: lấy từ dòng sau dấu ":" của commit do tools/release.mjs tạo.
      - id: notes
        shell: bash
        run: |
          subject=$(git log -1 --format=%s)
          note="${subject#*: }"
          [ "$note" = "$subject" ] && note="Cải tiến và sửa lỗi."
          echo "body=$note" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Muse Tool ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
